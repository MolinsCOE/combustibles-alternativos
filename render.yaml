services:
  - type: web
    name: combustibles-alternativos
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: combustibles-db
          property: connectionString
      - key: ENABLE_SWAGGER
        value: false
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: ""

databases:
  - name: combustibles-db
    plan: free
    databaseName: combustibles
    user: combustibles
